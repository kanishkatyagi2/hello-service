name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build Docker image
        run: docker build -t hello-service:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'hello-service:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Save image as tarball
        run: docker save hello-service:${{ github.sha }} -o hello-service.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-service-image
          path: hello-service.tar
          retention-days: 7